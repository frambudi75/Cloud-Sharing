server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 1024M;

    # Gzip Compression for maximum response speed
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static assets caching
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|webp|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
        access_log off;
    }

    # Akses normal web application
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Internal location khusus untuk Nginx X-Accel-Redirect (Zero-Copy File Serving)
    location /internal-storage/ {
        internal;
        alias /var/www/storage/uploads/;
    }

    # FastCGI PHP 8.5-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 600;
    }

    # Blokir akses ke file sensitif
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
